<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TriAIlign TaskManager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: white; border-radius: 8px; padding: 2rem 2.2rem; width: 100%; max-width: 340px; border: 1px solid #e0e0e0; }
    .login-card h1 { font-size: 1.2rem; font-weight: 600; color: #2c3e50; margin-bottom: 0.2rem; }
    .login-card .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: #666; margin-bottom: 4px; }
    .field input { width: 100%; padding: 9px 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    .field input:focus { outline: none; border-color: #2c3e50; }
    button { width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-top: 0.4rem; }
    button:hover { background: #34495e; }
    .error { background: #f8d7da; color: #842029; font-size: 13px; padding: 8px 12px; border-radius: 5px; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>TriAIlign - TaskManager</h1>
    <div class="subtitle">Sign in to manage your tasks</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
